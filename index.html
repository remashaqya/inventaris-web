<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard Inventaris</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body class="bg-gray-100 font-sans">
    <!-- Header -->
    <header
      class="bg-blue-700 text-white p-4 shadow-md sticky top-0 flex items-center gap-3"
    >
      <img
        src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEja1Fx6AIsRxcFt8KrYHPM1aXrSosPlXrjRXUfv_s-k7t-IsaM1Ygob2Hpl2h34uBxsNx-mJoloMcJhPR43SrxNaI0ertfFY_vt131zhqMpGBWLDwsxYqPLt2eriRiIIx9_lvmzGMR_2DCPdTJis9BYPjyBvPttV2sG80aEjWfKuqdtkA/s220/favicon.jpg"
        class="h-8 w-8 rounded-full border-2 border-white bg-white"
      />
      <h1 class="text-xl font-bold tracking-wide">Inventaris</h1>
    </header>

    <main class="p-4 max-w-md mx-auto">
      <div
        class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-blue-600 text-center"
      >
        <img
          src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEja1Fx6AIsRxcFt8KrYHPM1aXrSosPlXrjRXUfv_s-k7t-IsaM1Ygob2Hpl2h34uBxsNx-mJoloMcJhPR43SrxNaI0ertfFY_vt131zhqMpGBWLDwsxYqPLt2eriRiIIx9_lvmzGMR_2DCPdTJis9BYPjyBvPttV2sG80aEjWfKuqdtkA/s220/favicon.jpg"
          class="h-20 w-20 rounded-full mx-auto mb-4 border shadow-sm"
        />
        <h2 class="text-xl font-bold mb-6 text-gray-800">
          Sistem Manajemen Aset
        </h2>

        <a
          href="scan.html"
          class="block w-full bg-blue-600 text-white p-4 rounded-xl shadow hover:bg-blue-700 transition flex items-center justify-center gap-3 mb-4"
        >
          <i class="fas fa-qrcode text-2xl"></i>
          <span class="text-lg font-bold">Scan Barcode / QR</span>
        </a>
        <a
          href="inventaris.html"
          class="block w-full bg-emerald-500 text-white p-3 rounded-lg shadow hover:bg-emerald-600 transition flex items-center justify-center gap-2 mb-3"
        >
          <i class="fas fa-boxes"></i> Data Inventaris
        </a>
        <a
          href="riwayat.html"
          class="block w-full bg-indigo-500 text-white p-3 rounded-lg shadow hover:bg-indigo-600 transition flex items-center justify-center gap-2"
        >
          <i class="fas fa-history"></i> Riwayat Peminjaman
        </a>
      </div>
    </main>
  </body>
</html>
