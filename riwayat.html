<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riwayat Transaksi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">
  <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 flex justify-between items-center z-10">
    <h1 class="text-xl font-bold"><i class="fas fa-history mr-2"></i>Riwayat</h1>
    <a href="index.html" class="text-white"><i class="fas fa-arrow-left text-xl"></i></a>
  </header>
  <main class="p-4 max-w-lg mx-auto" id="tbBody">
    <div class="text-center text-gray-500 mt-10"><i class="fas fa-circle-notch fa-spin text-3xl mb-2 text-indigo-500"></i><p>Memuat data...</p></div>
  </main>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxx84YFVSb92cwBOX94F8twWkb1epAPV3nWiwRJX-HjrnK8jddlSgRxXqwTBvpPqPuF9A/exec"; 
    fetch(API_URL, { redirect: "follow", method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify({action: "getRiwayat"}) })
    .then(r => r.json()).then(res => {
      let html = '';
      res.data.reverse().forEach(row => { // Data terbaru di atas
        let tglPinjam = new Date(row[4]).toLocaleDateString('id-ID');
        let tglKembali = row[6] ? new Date(row[6]).toLocaleDateString('id-ID') : 'Belum';
        let status = row[8];
        let warnaS = status=='Selesai'?'text-emerald-600 bg-emerald-50':'text-orange-600 bg-orange-50';

        html += `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-3">
          <div class="flex justify-between items-start border-b pb-2 mb-2">
            <div>
              <h3 class="font-bold text-gray-800">${row[2]}</h3>
              <p class="text-xs text-gray-500"><i class="fas fa-phone-alt mr-1"></i>${row[3]}</p>
            </div>
            <span class="px-2 py-1 rounded text-[10px] font-bold ${warnaS}">${status}</span>
          </div>
          <div class="text-sm text-gray-600 space-y-1 mb-3">
            <p><span class="font-semibold text-gray-700">Barcode:</span> <span class="font-mono text-xs">${row[1]}</span></p>
            <div class="flex justify-between">
              <p><i class="far fa-calendar-alt mr-1"></i>Pinjam: <b>${tglPinjam}</b></p>
              <p><i class="far fa-calendar-check mr-1"></i>Kembali: <b>${tglKembali}</b></p>
            </div>
          </div>
          <div class="flex gap-2">
             <a href="${row[5]}" target="_blank" class="flex-1 bg-gray-100 text-gray-600 text-center py-2 rounded-lg text-xs font-bold hover:bg-gray-200"><i class="fas fa-image mr-1"></i>Foto Pinjam</a>
             ${row[7] ? `<a href="${row[7]}" target="_blank" class="flex-1 bg-gray-100 text-gray-600 text-center py-2 rounded-lg text-xs font-bold hover:bg-gray-200"><i class="fas fa-image mr-1"></i>Foto Kembali</a>` : ''}
          </div>
        </div>`;
      });
      document.getElementById('tbBody').innerHTML = html || '<div class="text-center text-gray-500 mt-10">Belum ada riwayat transaksi.</div>';
    });
  </script>
</body>
</html>
